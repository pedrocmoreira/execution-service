spring:
  application:
    name: execution-service
  mongodb:
    uri: ${MONGO_URI}
  data:
    mongodb:
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

server:
  port: ${SERVER_PORT:8083}

jwt:
  secret: ${JWT_SECRET}

app:
  seed:
    inventory: ${SEED_INVENTORY:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  otlp:
    metrics:
      export:
        enabled: false   # métricas via Prometheus (/actuator/prometheus); OTLP só para traces
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
