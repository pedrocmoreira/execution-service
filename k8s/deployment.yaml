apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: garage
  labels: {app: execution-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: execution-service}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: execution-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: execution-service
          # A pipeline de CI/CD substitui a imagem com "kubectl set image" (tag = SHA do commit)
          image: ghcr.io/OWNER/execution-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8083}]
          envFrom:
            - configMapRef: {name: execution-service-config}
          env:
            - name: RABBITMQ_USER
              valueFrom: {secretKeyRef: {name: garage-secrets, key: RABBITMQ_USER}}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: garage-secrets, key: RABBITMQ_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: garage-secrets, key: JWT_SECRET}}
            - name: MONGO_URI
              valueFrom: {secretKeyRef: {name: garage-secrets, key: EXECUTION_MONGO_URI}}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8083}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8083}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8083}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 768Mi}
